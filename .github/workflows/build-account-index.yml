name: Build account ID Parquet index

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-db-account-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install index builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.32.0" pyarrow duckdb

      - name: Build index from tg/processed
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BUCKET: buckets/Chatpataprani/Hitek_ImCR_API-bucket
          INDEX_SHARDS: "1024"
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add HF_TOKEN as a GitHub Actions repository secret."
            exit 1
          fi
          python scripts/build_account_index.py
